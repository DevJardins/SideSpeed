name: dependency-submission
# Sends the resolved Gradle dependency graph to GitHub so Dependabot alerts cover
# every module, including transitive libraries.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/dependency-submission@v6
