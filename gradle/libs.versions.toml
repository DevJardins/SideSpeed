[versions]
agp = "9.5.1"
kotlin = "2.4.21"
baselineprofile = "1.5.0"
profileinstaller = "1.4.1"
benchmarkMacro = "1.5.0"
uiautomator = "2.4.1"
testExtJunit = "1.3.0"
composeBom = "2026.06.01"
tvMaterial = "1.1.0"
datastore = "1.3.0"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
libadbAndroid = "3.1.1"
sunSecurityAndroid = "1.1"
conscrypt = "2.5.3"
hiddenapibypass = "6.1"
zxing = "3.5.4"
junit = "4.13.2"
json = "20260814"
coroutines = "1.11.0"
kadb = "2.1.4"
bouncycastle = "1.85"
# Patched floor for the Gradle plugin/build classpath (bcpkix alert fixes at 1.84).
bouncycastlePkixBuild = "1.84"
# Floors for transitive Gradle plugin/build-classpath deps (Dependabot alerts filed
# against settings.gradle.kts). Kept separate from shipped-code versions on purpose.
guavaBuild = "33.7.2-jre"
wireRuntimeBuild = "6.4.5"
jose4jBuild = "0.9.6"
jdom2Build = "2.0.6.1"
commonsLang3Build = "3.18.0"
httpclientBuild = "4.5.13"
workmanager = "2.11.2"
composeMultiplatform = "1.12.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
libadb-android = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadbAndroid" }
sun-security-android = { module = "com.github.MuntashirAkon:sun-security-android", version.ref = "sunSecurityAndroid" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "json" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
kadb = { module = "com.flyfishxu:kadb", version.ref = "kadb" }
kadb-mdns = { module = "com.flyfishxu:kadb-mdns", version.ref = "kadb" }
bouncycastle-bcprov-jdk15to18 = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil-jdk18on = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bctls-jdk18on = { module = "org.bouncycastle:bctls-jdk18on", version.ref = "bouncycastle" }
# Build/plugin classpath floors for Dependabot alerts (settings.gradle.kts manifest).
build-guava = { module = "com.google.guava:guava", version.ref = "guavaBuild" }
build-bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
build-bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastlePkixBuild" }
build-bcutil-jdk18on = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastlePkixBuild" }
build-wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wireRuntimeBuild" }
build-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4jBuild" }
build-jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2Build" }
build-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3Build" }
build-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclientBuild" }
jb-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
jb-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
jb-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
jb-compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
